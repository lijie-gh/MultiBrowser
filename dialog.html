<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="app.name">多屏浏览器</title>
<link rel="stylesheet" href="renderer/styles.css">
<style>
  html, body { height: 100%; }
  body.dialog-window {
    overflow: hidden;
    user-select: text;
    background: #10151f;
    font-size: 13px;
  }
  .dlg {
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 18px 22px 16px;
  }
  .dlg-head h2 { margin: 0; font-size: 16px; letter-spacing: .2px; }
  .dlg-head p { margin: 6px 0 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
  .dlg-body { flex: 1; min-height: 0; overflow: auto; margin-top: 12px; padding-right: 4px; }
  .dlg-foot {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-top: 14px;
    margin-top: 10px;
    border-top: 1px solid #1c2434;
  }
  .dlg-msg { color: #aab8cd; line-height: 1.85; font-size: 13px; margin: 4px 0; }
  .dlg-err { color: #ff8b96; font-size: 12px; min-height: 18px; margin-top: 8px; }
  textarea { min-height: 210px; }
  .close-list { flex-direction: column; align-items: stretch; }
  .close-list .target-chip { align-items: flex-start; }
  .target-chip span { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .target-chip small {
    color: #64708a; font-size: 10.5px; max-width: 380px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .results { max-height: none; min-height: 240px; }
</style>
</head>
<body class="dialog-window">
  <div class="dlg">
    <div class="dlg-head">
      <h2 id="dlg-title"></h2>
      <p id="dlg-sub"></p>
    </div>
    <div class="dlg-body" id="dlg-body"></div>
    <div class="dlg-foot" id="dlg-foot"></div>
  </div>
  <script src="i18n.js"></script>
  <script src="dialog.js"></script>
</body>
</html>
