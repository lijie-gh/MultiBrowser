<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="nb.title">新窗口</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    color: #e7edf8;
    background:
      radial-gradient(900px 480px at 50% -10%, rgba(63, 106, 190, .28), transparent 65%),
      radial-gradient(700px 420px at 85% 110%, rgba(35, 120, 95, .16), transparent 60%),
      #0b0d12;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    overflow: hidden;
  }
  .wrap {
    width: min(720px, 90vw);
    text-align: center;
    transform: translateY(-4vh);
  }
  .logo {
    width: 64px; height: 64px;
    margin: 0 auto 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px;
    padding: 10px;
    border-radius: 18px;
    background: linear-gradient(145deg, #1b2947, #101a2e);
    border: 1px solid #2b3f66;
    box-shadow: 0 18px 50px rgba(20, 50, 110, .35), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .logo span { border-radius: 4px; background: linear-gradient(135deg, #6ea8ff, #3d6fe0); }
  .logo span:nth-child(2) { opacity: .6; }
  .logo span:nth-child(3) { opacity: .8; }
  .logo span:nth-child(4) { opacity: .45; }
  h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: 2px; }
  .sub { margin: 10px 0 30px; color: #7f8ca3; font-size: 13px; letter-spacing: .3px; }
  .search {
    display: flex;
    gap: 8px;
    padding: 7px;
    border-radius: 14px;
    background: #111722;
    border: 1px solid #263149;
    box-shadow: 0 14px 40px rgba(0, 0, 0, .35);
    transition: border-color .18s, box-shadow .18s;
  }
  .search:focus-within {
    border-color: #3a5c95;
    box-shadow: 0 14px 40px rgba(0, 0, 0, .35), 0 0 0 4px rgba(79, 140, 255, .1);
  }
  .search input {
    flex: 1;
    height: 42px;
    border: 0;
    outline: none;
    background: transparent;
    color: #e7edf8;
    font-family: inherit;
    font-size: 15px;
    padding: 0 12px;
  }
  .search input::placeholder { color: #5c6880; }
  .search button {
    height: 42px;
    padding: 0 22px;
    border: 0;
    border-radius: 9px;
    background: linear-gradient(180deg, #4f8cff, #3b72e6);
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(79, 140, 255, .3);
  }
  .search button:hover { filter: brightness(1.08); }
  .links {
    margin-top: 34px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }
  .links a {
    display: inline-flex;
    align-items: center;
    height: 34px;
    padding: 0 16px;
    border-radius: 9px;
    background: #11161f;
    border: 1px solid #1f2735;
    color: #9fadc3;
    text-decoration: none;
    font-size: 12.5px;
    transition: all .15s;
  }
  .links a:hover {
    color: #fff;
    border-color: #33435f;
    background: #161e2b;
    transform: translateY(-1px);
  }
  .tips {
    margin-top: 40px;
    color: #5b677c;
    font-size: 11.5px;
    line-height: 1.8;
  }
  .tips b { color: #7e8ca3; font-weight: 500; }

  @media (max-width: 520px) {
    h1 { font-size: 21px; }
    .links a { padding: 0 10px; font-size: 11.5px; }
    .search button { padding: 0 14px; }
  }
  @media (max-height: 560px) {
    .wrap { transform: none; }
    .logo { width: 46px; height: 46px; margin-bottom: 12px; padding: 7px; border-radius: 13px; }
    h1 { font-size: 21px; }
    .sub { margin: 7px 0 16px; font-size: 11.5px; }
    .links { margin-top: 18px; }
    .tips { display: none; }
  }
  @media (max-height: 430px) {
    .sub, .links { display: none; }
  }

  /* 浅色主题：webview src 带 ?theme=light 时由下方脚本给 <html> 加 data-theme="light" */
  html { color-scheme: dark; }
  html[data-theme="light"] { color-scheme: light; }
  html[data-theme="light"] body {
    color: #23324a;
    background:
      radial-gradient(900px 480px at 50% -10%, rgba(63, 106, 190, .16), transparent 65%),
      radial-gradient(700px 420px at 85% 110%, rgba(35, 120, 95, .10), transparent 60%),
      #eef2f8;
  }
  html[data-theme="light"] .logo {
    background: linear-gradient(145deg, #eaf1fd, #dbe6f7);
    border-color: #c3d2ea;
    box-shadow: 0 18px 50px rgba(60, 100, 180, .18), inset 0 1px 0 rgba(255,255,255,.8);
  }
  html[data-theme="light"] .sub { color: #66748c; }
  html[data-theme="light"] .search {
    background: #ffffff;
    border-color: #d3dded;
    box-shadow: 0 14px 40px rgba(30, 60, 120, .12);
  }
  html[data-theme="light"] .search:focus-within {
    border-color: #4f8cff;
    box-shadow: 0 14px 40px rgba(30, 60, 120, .12), 0 0 0 4px rgba(79, 140, 255, .15);
  }
  html[data-theme="light"] .search input { color: #23324a; }
  html[data-theme="light"] .search input::placeholder { color: #8fa0b8; }
  html[data-theme="light"] .links a {
    background: #ffffff;
    border-color: #dde5f0;
    color: #55657e;
  }
  html[data-theme="light"] .links a:hover {
    color: #23324a;
    border-color: #b9c8de;
    background: #eef3fb;
  }
  html[data-theme="light"] .tips { color: #7a8699; }
  html[data-theme="light"] .tips b { color: #4c5a70; }
</style>
<script src="i18n.js"></script>
<script>
  /* 独立于 app.js：从 webview src 的查询参数读语言/主题（app.js 追加 ?lang=zh|en&theme=dark|light） */
  (function () {
    var params = new URLSearchParams(location.search);
    var theme = params.get('theme');
    if (theme === 'light' || theme === 'dark') {
      document.documentElement.setAttribute('data-theme', theme);
    }
    var lang = params.get('lang');
    if (lang === 'en' || lang === 'zh') setLang(lang);
    function ready() {
      applyLang();
      document.documentElement.lang = (getLang() === 'en') ? 'en' : 'zh-CN';
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', ready);
    } else {
      ready();
    }
  })();
</script>
</head>
<body>
  <div class="wrap">
    <div class="logo"><span></span><span></span><span></span><span></span></div>
    <h1 data-i18n="nb.appName">多屏浏览器</h1>
    <p class="sub" data-i18n="nb.sub">每个窗格都是独立的浏览器 · 顶部开启「同步操作」即可多窗口联动</p>
    <form class="search" action="https://www.baidu.com/s" method="get">
      <input name="wd" placeholder="搜索，或在上方地址栏输入网址" data-i18n-ph="nb.search" spellcheck="false">
      <button type="submit" data-i18n="nb.searchBtn">搜索</button>
    </form>
    <div class="links">
      <a href="https://www.baidu.com" data-i18n="nb.baidu">百度</a>
      <a href="https://www.bilibili.com" data-i18n="nb.bilibili">哔哩哔哩</a>
      <a href="https://www.zhihu.com" data-i18n="nb.zhihu">知乎</a>
      <a href="https://weibo.com" data-i18n="nb.weibo">微博</a>
      <a href="https://www.xiaohongshu.com" data-i18n="nb.xiaohongshu">小红书</a>
      <a href="https://github.com">GitHub</a>
      <a href="https://www.douyin.com" data-i18n="nb.douyin">抖音</a>
      <a href="https://www.taobao.com" data-i18n="nb.taobao">淘宝</a>
    </div>
    <div class="tips">
      <b data-i18n="nb.tip1t">多账号</b><span data-i18n="nb.tip1b">：每个窗口的登录状态互不影响，可以同时登录同一个网站的多个账号。</span><br>
      <b data-i18n="nb.tip2t">换账号</b><span data-i18n="nb.tip2b">：窗口右上角「⋯ → 重置此窗口登录数据」即可清掉这个窗口的登录。</span>
    </div>
  </div>
</body>
</html>
